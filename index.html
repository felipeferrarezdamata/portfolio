  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#FAF7F2;color:#111111;font-family:'Inter Tight',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#C9410F}\na:hover{color:#111111}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:grid;grid-template-columns:{{ gridCols }};min-height:100vh\">\n\n<aside style=\"display:{{ railDisplay }};position:sticky;top:0;height:100vh;background:#FFFFFF;border-right:1px solid #E5DFD3;flex-direction:column;overflow:hidden\">\n  <div style=\"padding:20px 22px 16px;border-bottom:1px solid #E5DFD3;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"width:30px;height:30px;border-radius:5px;background:#E8541C;color:#FFFFFF;display:grid;place-items:center;font-family:'Newsreader',serif;font-size:15px;font-weight:600\">F<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;font-size:12px;line-height:1.3;color:#5B5B5B\"><strong style=\"color:#111111;font-weight:600\">Felipe Ferrarez da Mata<\u002Fstrong>Instructional Designer<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5B5B5B\">PORTFOLIO · 2026 · ~6 MIN<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5B5B5B\">\n      <div style=\"flex:1;height:4px;background:#E5DFD3;border-radius:2px;overflow:hidden\"><div style=\"height:100%;width:{{ progressPct }};background:#E8541C\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">{{ progressPct }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <nav style=\"flex:1;overflow-y:auto;padding:8px 10px 14px;display:flex;flex-direction:column\">\n    <sc-for list=\"{{ railItems }}\" as=\"it\" hint-placeholder-count=\"10\">\n      <sc-if value=\"{{ it.group }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:12px 10px 5px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A\">{{ it.group }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <a href=\"{{ it.href }}\" style=\"display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:#2A2A2A;background:{{ it.bg }}\" style-hover=\"background:#F2EDE4\">\n        <span style=\"width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:9px;border:1px solid {{ it.numBorder }};background:{{ it.numBg }};color:{{ it.numColor }}\">{{ it.n }}<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.3;font-weight:500\">{{ it.label }}<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#8A8A8A\">{{ it.min }}<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fnav>\n  <div style=\"padding:12px 22px;border-top:1px solid #E5DFD3;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5B5B5B\">\n    <span>Burnaby, BC<\u002Fspan>\n    <a href=\"mailto:felipeferrarezdamata@gmail.com\" style=\"font-weight:500\">Email →<\u002Fa>\n  <\u002Fdiv>\n<\u002Faside>\n\n<main style=\"display:flex;flex-direction:column;min-width:0\">\n  <div style=\"position:sticky;top:0;z-index:5;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid #E5DFD3;padding:12px clamp(20px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px\">\n    <div style=\"display:flex;align-items:center;gap:8px;color:#5B5B5B;min-width:0\"><span>Portfolio<\u002Fspan><span style=\"color:#8A8A8A\">›<\u002Fspan><strong style=\"color:#2A2A2A;font-weight:500\">{{ activeLabel }}<\u002Fstrong><\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <a href=\"#resume\" style=\"display:inline-flex;align-items:center;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;border:1px solid #D6CFBE;color:#2A2A2A;text-decoration:none\" style-hover=\"background:#FFFFFF\">Resume<\u002Fa>\n      <a href=\"mailto:felipeferrarezdamata@gmail.com\" style=\"display:inline-flex;align-items:center;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;background:#C9410F;color:#FFFFFF;text-decoration:none\">Get in touch<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:100%;max-width:1040px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(20px,4vw,40px) 80px;box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(40px,6vw,64px)\">\n\n    <section id=\"welcome\" style=\"display:flex;flex-direction:column;gap:22px;scroll-margin-top:70px\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#D2DCCA;color:#314726;border:1px solid #5B7553\">Instructional Designer · L&amp;D<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-family:'JetBrains Mono',monospace;font-size:10px;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">⏱ ~6 min<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Open to hybrid &amp; remote<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(40px,5.6vw,64px);line-height:1.04;letter-spacing:-.02em;max-width:820px;text-wrap:balance\">I design for the moment <em style=\"color:#C9410F;font-weight:400\">after<\u002Fem> training ends.<\u002Fh1>\n      <p style=\"margin:0;font-size:18px;line-height:1.6;color:#2A2A2A;max-width:680px;text-wrap:pretty\">I've spent 15 years designing learning for colleges, a franchise network and corporate teams. Today I design career readiness curriculum as Co-op Education Manager at Greystone College, and interactive business courses for Langara Continuing Studies and Douglas College.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:6px\">\n        <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A\">In this portfolio you will<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\">\n          <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">LO 01<\u002Fspan><span style=\"font-size:14px;line-height:1.45\">Open live modules from two full courses I designed<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">LO 02<\u002Fspan><span style=\"font-size:14px;line-height:1.45\">See the design decisions behind each one<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">LO 03<\u002Fspan><span style=\"font-size:14px;line-height:1.45\">Follow how I run a co-op learning path<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">LO 04<\u002Fspan><span style=\"font-size:14px;line-height:1.45\">Review my credentials and resume<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:14px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#FDF1EA;color:#C9410F;border:1px solid #F8DDC9\">Knowledge check · how I think<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8A8A\">1 QUESTION<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(20px,2.4vw,24px);line-height:1.25\">A team is still missing deadlines after a time-management workshop. What do you check first?<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ quizOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;font-family:inherit;font-size:15px;line-height:1.45;padding:12px 16px;border-radius:10px;cursor:pointer;color:#111111;background:{{ o.bg }};border:1.5px solid {{ o.border }};display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5B5B5B;padding-top:2px\">{{ o.key }}<\u002Fspan>\n              <span>{{ o.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 18px;border-radius:10px;background:{{ fbBg }};border:1px solid {{ fbBorder }};color:{{ fbInk }};display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\">{{ fbLabel }}<\u002Fspan>\n            <span style=\"font-family:'Newsreader',serif;font-size:17px;line-height:1.45\">{{ fbText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <article id=\"hrm\" style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:16px;padding:clamp(20px,3.5vw,40px);display:flex;flex-direction:column;gap:24px;scroll-margin-top:70px\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#FDF1EA;color:#C9410F;border:1px solid #F8DDC9\">Case study 01<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Interactive e-learning<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Langara Continuing Studies<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#5B5B5B\">GBSC-1003<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance\">Human Resources Management: session modules<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:#2A2A2A;max-width:720px;text-wrap:pretty\">Self-paced modules that learners complete before each class, about 30 minutes each. Every module opens with seven measurable objectives, teaches through BC workplaces and BC law, and closes with a discussion-board reflection.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;align-items:start\">\n        <a href=\"{{ hrmPreview }}\" target=\"_blank\" style=\"display:block;position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;border:1px solid #D6CFBE;border-radius:12px;background:#FAF7F2;text-decoration:none\">\n          <iframe src=\"{{ hrmPreview }}\" loading=\"lazy\" tabindex=\"-1\" title=\"GBSC-1003 Session 3 module\" style=\"position:absolute;top:0;left:0;width:250%;height:250%;border:0;transform:scale(.4);transform-origin:0 0;pointer-events:none\"><\u002Fiframe>\n          <span style=\"position:absolute;left:12px;bottom:12px;background:#C9410F;color:#FFFFFF;font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px\">Open live module ↗<\u002Fspan>\n        <\u002Fa>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;padding-bottom:16px;border-bottom:1px solid #E5DFD3\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Audience<\u002Fspan><span style=\"font-size:14px\">Adult continuing studies learners<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Length<\u002Fspan><span style=\"font-size:14px\">~28–30 min per session<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Build<\u002Fspan><span style=\"font-size:14px\">Custom HTML, AI-assisted<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Reference<\u002Fspan><span style=\"font-size:14px\">Dessler &amp; Chhinzer, 16th Cdn ed.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A\">Selected modules<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <sc-for list=\"{{ hrmModules }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <a href=\"{{ m.href }}\" target=\"_blank\" style=\"display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#2A2A2A;border:1px solid #E5DFD3\" style-hover=\"background:#FDF1EA;border-color:#F8DDC9\">\n                <span style=\"width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;background:#FFFFFF;border:1px solid #D6CFBE;color:#5B5B5B\">{{ m.n }}<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.35;font-weight:500\">{{ m.title }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#C9410F\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px\">\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 01<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">Scenarios set in real BC contexts, such as a restaurant redesigning a server role, with feedback that explains every wrong option<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 02<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">An interaction every 2–3 minutes: knowledge checks, drag-and-drop sorting, tabbed explorations<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 03<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">All scenarios and on-screen text written originally; the textbook is cited, not reproduced<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article id=\"entr\" style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:16px;padding:clamp(20px,3.5vw,40px);display:flex;flex-direction:column;gap:24px;scroll-margin-top:70px\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#FDF1EA;color:#C9410F;border:1px solid #F8DDC9\">Case study 02<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Interactive e-learning<\u002Fspan>\n        <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Langara Continuing Studies<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#5B5B5B\">ENTR-1009<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance\">How To Start Your Own Business: modules that build a business plan<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:#2A2A2A;max-width:720px;text-wrap:pretty\">Weekly modules of about ten screens, 25–30 minutes each. Every week gives learners one input for their own business plan, from choosing a path to ownership through marketing and accounting, using Metro Vancouver businesses as examples.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;padding-bottom:16px;border-bottom:1px solid #E5DFD3\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Audience<\u002Fspan><span style=\"font-size:14px\">Aspiring entrepreneurs<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Length<\u002Fspan><span style=\"font-size:14px\">~25–30 min per week<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Flow<\u002Fspan><span style=\"font-size:14px\">Hook, examples, concept, check, apply<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A\">Outcome<\u002Fspan><span style=\"font-size:14px\">Learner’s own business plan<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A\">Selected modules<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <sc-for list=\"{{ entrModules }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <a href=\"{{ m.href }}\" target=\"_blank\" style=\"display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#2A2A2A;border:1px solid #E5DFD3\" style-hover=\"background:#FDF1EA;border-color:#F8DDC9\">\n                <span style=\"width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;background:#FFFFFF;border:1px solid #D6CFBE;color:#5B5B5B\">{{ m.n }}<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.35;font-weight:500\">{{ m.title }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#C9410F\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"{{ entrPreview }}\" target=\"_blank\" style=\"display:block;position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;border:1px solid #D6CFBE;border-radius:12px;background:#FAF7F2;text-decoration:none\">\n          <iframe src=\"{{ entrPreview }}\" loading=\"lazy\" tabindex=\"-1\" title=\"ENTR-1009 Week 4 module\" style=\"position:absolute;top:0;left:0;width:250%;height:250%;border:0;transform:scale(.4);transform-origin:0 0;pointer-events:none\"><\u002Fiframe>\n          <span style=\"position:absolute;left:12px;bottom:12px;background:#C9410F;color:#FFFFFF;font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px\">Open live module ↗<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px\">\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 01<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">Each module ends by applying the concept to the learner’s own venture, such as drafting an IMC strategy<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 02<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">Numbers-heavy weeks walk through a worked scenario before learners calculate their own capital requirements<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FAF7F2;border:1px solid #E5DFD3;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9410F\">DECISION 03<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">A Week 1 self-assessment (“What kind of entrepreneur are you?”) personalizes the course from the start<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article id=\"greystone\" style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:16px;padding:clamp(20px,3.5vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px;align-items:start;scroll-margin-top:70px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;background:#FAF7F2;border:1px solid #E5DFD3;border-radius:12px;padding:clamp(18px,3vw,28px)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:#C9410F\">CO-OP LEARNING PATH<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8A8A\">GREYSTONE · 2026<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n          <div style=\"border:1px dashed #BFB7A2;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#FFFFFF\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;color:#8A8A8A\">INPUT<\u002Fspan><span style=\"font-size:14px;font-weight:600\">Employer partner needs<\u002Fspan><\u002Fdiv>\n          <div style=\"border:1px dashed #BFB7A2;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#FFFFFF\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;color:#8A8A8A\">INPUT<\u002Fspan><span style=\"font-size:14px;font-weight:600\">Program staff needs<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;color:#C9410F;line-height:1\">↓<\u002Fdiv>\n        <div style=\"background:#E8541C;color:#FFFFFF;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-family:'Newsreader',serif;font-size:22px;font-weight:500\">Onboarding curriculum<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px\">4 STREAMS<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px\">\n            <span style=\"background:#FFFFFF;color:#111111;border-radius:999px;padding:5px 12px;font-size:13px\">Business<\u002Fspan>\n            <span style=\"background:#FFFFFF;color:#111111;border-radius:999px;padding:5px 12px;font-size:13px\">Technology<\u002Fspan>\n            <span style=\"background:#FFFFFF;color:#111111;border-radius:999px;padding:5px 12px;font-size:13px\">Digital Marketing<\u002Fspan>\n            <span style=\"background:#FFFFFF;color:#111111;border-radius:999px;padding:5px 12px;font-size:13px\">Hospitality<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;color:#C9410F;line-height:1\">↓<\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #D6CFBE;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n          <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:600\">Verified job board<\u002Fspan><span style=\"font-size:13px;color:#5B5B5B\">10 programs · NOC-mapped · 3 tracks<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#C9410F\">WEEKLY<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center;color:#C9410F;line-height:1\">↓<\u002Fdiv>\n        <div style=\"background:#D2DCCA;border:1px solid #5B7553;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#314726\"><span style=\"font-family:'Newsreader',serif;font-size:20px;font-weight:500\">Co-op placement<\u002Fspan><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em\">OUTCOME<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#FDF1EA;color:#C9410F;border:1px solid #F8DDC9\">Case study 03<\u002Fspan>\n          <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#F2EDE4;color:#2A2A2A;border:1px solid #E5DFD3\">Work-integrated learning<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.14;letter-spacing:-.015em;text-wrap:balance\">Career readiness and co-op onboarding curriculum<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A2A2A;text-wrap:pretty\">Since May 2026, I've designed the career readiness and onboarding curriculum for incoming co-op students at Greystone College. It is built from needs assessments with employer partners and program staff.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;line-height:1.5\"><span style=\"width:20px;height:20px;border-radius:50%;background:#5B7553;color:#FFFFFF;display:grid;place-items:center;font-size:11px\">✓<\u002Fspan><span>Onboarding sequenced by stream, so students prepare for the roles their diploma qualifies for<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;line-height:1.5\"><span style=\"width:20px;height:20px;border-radius:50%;background:#5B7553;color:#FFFFFF;display:grid;place-items:center;font-size:11px\">✓<\u002Fspan><span>Every posting tagged to NOC-aligned program codes, so students see only roles that count<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;line-height:1.5\"><span style=\"width:20px;height:20px;border-radius:50%;background:#5B7553;color:#FFFFFF;display:grid;place-items:center;font-size:11px\">✓<\u002Fspan><span>Dead links archived weekly with evidence, so the board is always live<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;line-height:1.5\"><span style=\"width:20px;height:20px;border-radius:50%;background:#5B7553;color:#FFFFFF;display:grid;place-items:center;font-size:11px\">✓<\u002Fspan><span>Three tracks, so students with prior experience aren't underplaced<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article id=\"dlit\" style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:16px;padding:clamp(20px,3.5vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px;align-items:start;scroll-margin-top:70px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;border-radius:999px;background:#FDF1EA;color:#C9410F;border:1px solid #F8DDC9\">Credential<\u002Fspan>\n          <span style=\"display:inline-flex;padding:4px 11px;font-size:11px;font-weight:500;border-radius:999px;background:#D2DCCA;color:#314726;border:1px solid #5B7553\">Completed<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.14;letter-spacing:-.015em;text-wrap:balance\">Digital Learning for Innovative Teaching (DLIT)<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A2A2A;text-wrap:pretty\">A 10-credit program at Vancouver Community College. It shapes how I choose tools on evidence, build accessible and interactive materials, plan for when technology fails, and use GenAI responsibly.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">Inclusive &amp; accessible design<\u002Fspan>\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">Digital assessment<\u002Fspan>\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">Curation &amp; open licensing<\u002Fspan>\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">Indigenization &amp; reconciliation<\u002Fspan>\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">GenAI literacy<\u002Fspan>\n          <span style=\"padding:5px 12px;font-size:12px;font-weight:500;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">Tech contingency planning<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1F3864;color:#FFFFFF;border-radius:12px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em\">VANCOUVER COMMUNITY COLLEGE<\u002Fspan><span style=\"background:#FFFFFF;color:#1F3864;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.1em;padding:4px 10px\">10 CREDITS<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ dlitCourses }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:#2A4575\">\n              <span style=\"width:22px;height:22px;border-radius:50%;background:#5B7553;display:grid;place-items:center;font-size:11px\">✓<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#C9D3E6\">{{ d.code }}<\u002Fspan><span style=\"font-size:14px\">{{ d.name }}<\u002Fspan><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9D3E6\">2 cr<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <section id=\"courses\" style=\"display:flex;flex-direction:column;gap:18px;scroll-margin-top:70px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.015em\">Courses &amp; programs designed<\u002Fh2>\n        <span style=\"display:inline-flex;padding:4px 11px;font-family:'JetBrains Mono',monospace;font-size:10px;border-radius:999px;background:#F2EDE4;border:1px solid #E5DFD3\">2009 – 2026<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:14px;padding:6px 18px\">\n        <sc-for list=\"{{ courses }}\" as=\"co\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:4px 24px;padding:14px 0;border-bottom:1px solid #E5DFD3;align-items:baseline\">\n            <span style=\"font-size:15px;font-weight:600;line-height:1.35\">{{ co.name }}<\u002Fspan>\n            <span style=\"font-size:14px;color:#C9410F\">{{ co.org }}<\u002Fspan>\n            <span style=\"font-size:14px;color:#5B5B5B;line-height:1.45\">{{ co.scope }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A\">{{ co.year }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showEarlier }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px\">\n          <sc-for list=\"{{ earlier }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"background:#F2EDE4;border:1px solid #E5DFD3;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#C9410F\">{{ p.tag }}<\u002Fspan>\n              <span style=\"font-family:'Newsreader',serif;font-size:19px;font-weight:500;line-height:1.25\">{{ p.title }}<\u002Fspan>\n              <span style=\"font-size:13px;line-height:1.5;color:#2A2A2A\">{{ p.body }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section id=\"experience\" style=\"display:flex;flex-direction:column;gap:18px;scroll-margin-top:70px\">\n      <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.015em\">Experience<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:0;border-left:2px solid #E5DFD3;margin-left:10px\">\n        <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:22px 1fr;gap:14px;padding:0 0 22px;margin-left:-12px\">\n            <span style=\"width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:2px solid #E8541C;box-sizing:border-box;margin-top:2px\"><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap\"><span style=\"font-size:16px;font-weight:600\">{{ r.org }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A\">{{ r.dates }}<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:14px;color:#C9410F;font-weight:500\">{{ r.title }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.5;color:#5B5B5B\">{{ r.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showProcess }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"approach\" style=\"display:flex;flex-direction:column;gap:18px;scroll-margin-top:70px\">\n      <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.015em\">ADDIE, adapted for real timelines<\u002Fh2>\n      <div style=\"padding:18px 22px;border-radius:10px;background:#1F3864;color:#FFFFFF;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#C9D3E6\">How I adapt it<\u002Fspan>\n        <span style=\"font-family:'Newsreader',serif;font-size:18px;line-height:1.45\">Analysis compressed into one or two stakeholder sessions. Design and development run as parallel sprints with SME checkpoints. Evaluation feeds the next cycle.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px\">\n        <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"5\">\n          <div style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"width:34px;height:34px;border-radius:50%;background:#FDF1EA;border:1px solid #F8DDC9;color:#C9410F;display:grid;place-items:center;font-family:'Newsreader',serif;font-size:18px;font-weight:600\">{{ ph.letter }}<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:600\">{{ ph.name }}<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:#5B5B5B\">{{ ph.body }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;padding-top:6px\">\n        <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A\">{{ t.group }}<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.55\">{{ t.items }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"resume\" style=\"background:#FFFFFF;border:1px solid #E5DFD3;border-radius:16px;padding:clamp(20px,3.5vw,40px);display:flex;flex-direction:column;gap:28px;scroll-margin-top:70px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.015em\">Resume<\u002Fh2>\n        <a href=\"#resume\" style=\"display:inline-flex;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;border:1px solid #D6CFBE;color:#2A2A2A;text-decoration:none\">Download PDF ↓<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#2A2A2A;max-width:780px;text-wrap:pretty\">Learning and Development professional with 15 years in instructional design, e-learning development, curriculum design and learning program management across post-secondary, franchise and corporate environments. MBA-qualified; multilingual in English, Portuguese and Spanish.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A;padding-bottom:10px;border-bottom:1px solid #111111\">Professional experience<\u002Fdiv>\n        <sc-for list=\"{{ resumeRoles }}\" as=\"rr\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px 32px;padding:20px 0;border-bottom:1px solid #E5DFD3\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <span style=\"font-size:15px;font-weight:600\">{{ rr.title }}<\u002Fspan>\n              <span style=\"font-size:14px;color:#C9410F\">{{ rr.org }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A\">{{ rr.dates }}<\u002Fspan>\n            <\u002Fdiv>\n            <ul style=\"grid-column:span 2;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;color:#2A2A2A\">\n              <sc-for list=\"{{ rr.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <li>{{ b }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A;padding-bottom:10px;border-bottom:1px solid #111111\">Education<\u002Fdiv>\n          <sc-for list=\"{{ education }}\" as=\"ed\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;font-weight:600\">{{ ed.name }}<\u002Fspan><span style=\"font-size:13px;color:#5B5B5B\">{{ ed.meta }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A8A8A;padding-bottom:10px;border-bottom:1px solid #111111\">Certifications<\u002Fdiv>\n          <sc-for list=\"{{ certs }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;font-weight:600\">{{ c.name }}<\u002Fspan><span style=\"font-size:13px;color:#5B5B5B\">{{ c.meta }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"background:#C9410F;color:#FFFFFF;border-radius:16px;padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:20px;scroll-margin-top:70px\">\n      <span style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\">Module wrap-up<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Newsreader',serif;font-weight:500;font-size:clamp(32px,4.4vw,52px);line-height:1.05;letter-spacing:-.02em;max-width:760px;text-wrap:balance\">Hiring an instructional designer? Let's talk.<\u002Fh2>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <a href=\"mailto:felipeferrarezdamata@gmail.com\" style=\"display:inline-flex;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:500;background:#FFFFFF;color:#111111;text-decoration:none\">felipeferrarezdamata@gmail.com<\u002Fa>\n        <a href=\"https://linkedin.com/in/fdamata\" style=\"display:inline-flex;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:500;border:1px solid #FFFFFF;color:#FFFFFF;text-decoration:none\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;padding-top:16px;border-top:1px solid #E88A66\">\n        <span>© 2026 Felipe Ferrarez da Mata<\u002Fspan><span>Burnaby, BC<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showEarlierSamples&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showApproach&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: 'welcome', progress: 0, narrow: false, answer: null };\n  sections = [\n    { id: 'welcome', n: '01', label: 'Welcome', min: '1m', group: 'Introduction' },\n    { id: 'hrm', n: '02', label: 'HR Management modules', min: '2m', group: 'Work' },\n    { id: 'entr', n: '03', label: 'Start Your Own Business', min: '2m' },\n    { id: 'greystone', n: '04', label: 'Co-op curriculum', min: '1m' },\n    { id: 'dlit', n: '05', label: 'DLIT credential', min: '1m' },\n    { id: 'courses', n: '06', label: 'Courses designed', min: '1m' },\n    { id: 'experience', n: '07', label: 'Experience', min: '1m', group: 'About' },\n    { id: 'approach', n: '08', label: 'Approach', min: '1m' },\n    { id: 'resume', n: '09', label: 'Resume', min: '2m' },\n    { id: 'contact', n: '10', label: 'Contact', min: '' }\n  ];\n  componentDidMount() {\n    this.onScroll = () => {\n      const h = document.documentElement;\n      const max = h.scrollHeight - window.innerHeight;\n      const progress = max > 0 ? Math.min(1, window.scrollY / max) : 0;\n      let active = this.sections[0].id;\n      for (const s of this.sections) { const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top < window.innerHeight * 0.35) active = s.id; }\n      if (progress > 0.995) active = 'contact';\n      if (active !== this.state.active || Math.abs(progress - this.state.progress) > 0.005) this.setState({ active, progress });\n    };\n    this.onResize = () => { const narrow = window.innerWidth < 960; if (narrow !== this.state.narrow) this.setState({ narrow }); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    this.onResize(); this.onScroll();\n  }\n  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); }\n  data() { const R=(id,p)=>(window.__resources&&window.__resources[id])||p; return {\nshowEarlier: this.props.showEarlierSamples ?? true,\n      showProcess: this.props.showApproach ?? true,\n      earlier: [\n        { tag: 'STORYLINE · BRANCHING', title: 'HR Foundations for new managers', body: 'Decision-po ivery', year: '2015' }\n      ],\n      phases: [\n        { letter: 'A', name: 'Analyse', body: 'Stakeholder interviews, performance gap, audience profile, success metrics.' },\n        { letter: 'D', name: 'Design', body: 'Objectives, sequencing, modality, assessment strategy, storyboard.' },\n        { letter: 'D', name: 'Develop', body: 'Rise and Storyline builds, scenarios, guides, SME review.' },\n        { letter: 'I', name: 'Implement', body: 'LMS deployment, pilot cohort, go-live support.' },\n        { letter: 'E', name: 'Evaluate', body: 'Kirkpatrick L1–L3, completion data, revision cycle.' }\n      ],\n      resumeRoles: [\n        { title: 'Co-op Education Manager', org: 'Greystone College Vancouver, ILSC Education Group', dates: 'May 2026 – Present', bullets: ['Design career readiness and onboarding curriculum for incoming co-op students across Business, Technology, Digital Marketing and Hospitality streams', 'Conduct needs assessments with employer partners and program staff to identify curriculum gaps and inform content development', 'Oversee PTIB and institutional compliance documentation, interpreting policy and regulatory requirements', 'Act as subject matter expert on program curriculum, advising staff and partners on instructional strategy'] },\n        { title: 'Contract Faculty', org: 'Douglas College', dates: '2024 – Present', bullets: ['Develop and deliver curriculum for Business Strategy, Organizational Behaviour and Management aligned with program learning outcomes', 'Apply adult education theory from PIDP to course design'] },\n        { title: 'Part-Time Instructor', org: 'Langara College Continuing Studies', dates: '2025 – Present', bullets: ['Design curriculum and course materials for HR Management, Fundamentals of Management, and Fundamentals of Business and Entrepreneurship', 'Apply evaluation methodology to assess training effectiveness and iterate on content and delivery'] },\n        { title: 'Divisional Business Manager / Partnerships and Training Coordinator', org: 'KPU International', dates: 'Dec 2021 – Mar 2024', bullets: ['Designed onboarding and training curriculum for staff, including job aids, facilitator guides and LMS-based course libraries', 'Researched international education policy and regulatory requirements to inform staff training content'] },\n        { title: 'Regional Business Manager and Master Franchisee', org: 'IE Intercâmbio, Brazil', dates: '2009 – 2021', bullets: ['Built and led curriculum development for a franchise network of 15 to 20 locations, designing train-the-trainer programs and instructional materials', 'Conducted needs assessments across the network and adapted training to regional and role-specific requirements'] },\n        { title: 'Assistant Professor', org: 'Universidade Federal de Minas Gerais (UFMG)', dates: '2015', bullets: ['Developed and delivered curriculum on franchising, entrepreneurship and international business strategy'] },\n        { title: 'Member, Board of Directors (Volunteer)', org: 'SFU Childcare Society', dates: 'Sep 2025 – Present', bullets: ['Strategic governance and policy oversight in partnership with Simon Fraser University'] }\n      ],\n      education: [\n        { name: 'Master of Business Administration (MBA)', meta: 'University Canada West · 2021' },\n        { name: 'Master’s, Marketing, Strategy and Operations', meta: 'Universidade Federal de Minas Gerais · 2016' },\n        { name: 'Bachelor’s, Economics', meta: 'Universidade Federal de Minas Gerais · 2009' }\n      ],\n      certs: [\n        { name: 'Digital Learning for Innovative Teaching (DLIT) Micro-credential', meta: 'Vancouver Community College · Completed' },\n        { name: 'Train the Trainer Certificate', meta: 'Vancouver Community College · 2024' },\n        { name: 'Provincial Instructor Diploma (PIDP)', meta: 'Vancouver Community College · In progress' }\n      ],\n      tools: [\n        { group: 'Authoring', items: 'Articulate Rise, Storyline, Articulate 360, Vyond, Canva' },\n        { group: 'LMS', items: 'Brightspace D2L, Moodle, Blackboard' },\n        { group: 'Frameworks', items: 'ADDIE, SAM, Bloom’s, Kirkpatrick, UDL, WCAG 2.1' },\n        { group: 'Credentials', items: 'DLIT (VCC), Train the Trainer (VCC), PIDP in progress, MBA' }\n      ]\n}; }\n  renderVals() {\n    const R=(id,p)=>(window.__resources&&window.__resources[id])||p;\n    const d = this.data();\n    const { active, progress, narrow, answer } = this.state;\n    const idx = this.sections.findIndex(s => s.id === active);\n    const railItems = this.sections.filter(s => s.id !== 'approach' || d.showProcess).map((s, i) => {\n      const si = this.sections.indexOf(s), isA = s.id === active, done = si < idx;\n      return { ...s, group: s.group || '', href: '#' + s.id, bg: isA ? '#FDF1EA' : 'transparent',\n        numBg: isA ? '#E8541C' : done ? '#5B7553' : '#FFFFFF', numColor: isA || done ? '#FFFFFF' : '#5B5B5B', numBorder: isA ? '#E8541C' : done ? '#5B7553' : '#D6CFBE' };\n    });\n    const opts = [\n      { key: 'A', label: 'Whether the workshop content was accurate' },\n      { key: 'B', label: 'What gets in the way on the job: tools, workload, or unclear expectations', correct: true },\n      { key: 'C', label: 'Whether attendees passed the post-workshop quiz' }\n    ];\n    const picked = opts.find(o => o.key === answer);\n    const quizOpts = opts.map(o => {\n      const sel = o.key === answer;\n      return { ...o, pick: () => this.setState({ answer: o.key }),\n        bg: answer && o.correct ? '#D2DCCA' : sel ? '#E9C9C5' : '#FFFFFF',\n        border: answer && o.correct ? '#5B7553' : sel ? '#A8443E' : '#E5DFD3' };\n    });\n    const right = picked && picked.correct;\n    return {\n      ...d,\n      gridCols: narrow ? 'minmax(0,1fr)' : '300px minmax(0,1fr)',\n      railDisplay: narrow ? 'none' : 'flex',\n      progressPct: Math.round(progress * 100) + '%',\n      railItems,\n      activeLabel: (this.sections.find(s => s.id === active) || {}).label,\n      quizOpts,\n      hasAnswer: !!answer,\n      fbLabel: right ? 'That’s where I start' : 'Consider this',\n      fbText: right ? 'Training only fixes skill gaps. If the barrier is the environment, another course won’t move it, so I look at the job first.' : 'Accurate content and passing scores don’t mean behaviour changed. I start by asking what gets in the way on the job, because training can only fix a skill gap.',\n      fbBg: right ? '#D2DCCA' : '#FEF3C7', fbBorder: right ? '#5B7553' : '#F59E0B', fbInk: right ? '#314726' : '#92400E',\n      hrmPreview: R('hrm_session_03','modules/hrm-session-03.html'),\n      entrPreview: R('entr_week_04','modules/entr-week-04.html'),\n      dlitCourses: [\n        { code: 'DLIT 3010', name: 'Digital Literacy and Learning' },\n        { code: 'DLIT 3020', name: 'Assessing Digital Learning' },\n        { code: 'DLIT 3030', name: 'Curating Digital Learning' },\n        { code: 'DLIT 3040', name: 'Creating Digital Learning' },\n        { code: 'DLIT 3050', name: 'Advancing Information Literacy' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
